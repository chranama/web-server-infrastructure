name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cloudflared
        run: brew install cloudflared
      - name: Check shell syntax
        run: |
          bash -n cloudflare/validate-shared-ingress.sh
          bash -n cloudflare/activate-shared-ingress.sh
          bash -n macos/verify-sshd-key-only.sh
          bash -n macos/install-sshd-key-only.sh
          bash -n macos/validate-tailscaled-candidate.sh
          bash -n macos/install-tailscaled-system.sh
          bash -n macos/cutover-tailscaled-system.sh
          bash -n macos/verify-tailscaled-system.sh
          bash -n tests/test-shared-ingress.sh
          bash -n tests/test-plist-template.sh
          bash -n tests/test-ssh-templates.sh
          bash -n tests/test-tailscaled-system.sh
          bash -n tests/test-no-secrets.sh
      - name: Test ingress contract
        run: bash tests/test-shared-ingress.sh
      - name: Validate canonical template with cloudflared
        env:
          SHARED_INGRESS_CLOUDFLARED_BIN: /opt/homebrew/bin/cloudflared
        run: bash tests/test-shared-ingress.sh
      - name: Test launchd template
        run: bash tests/test-plist-template.sh
      - name: Test SSH templates
        run: bash tests/test-ssh-templates.sh
      - name: Test system tailscaled controls
        run: bash tests/test-tailscaled-system.sh
      - name: Test repository boundary
        run: bash tests/test-no-secrets.sh
